# Publishes paidonpangea.xyz (site/) to GitHub Pages with fresh Pangea fee data (site/data.json, never committed).
# GitHub's own schedule is unreliable for a busy cron (runs get skipped for hours), so each run starts the
# next one itself about 10 minutes later. The hourly schedule only restarts the chain if it ever breaks.
name: Publish PAID
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Note the start time
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Last published data (kept if this run's build fails)
        run: |
          mkdir -p site
          curl -fsSL "https://paidonpangea.xyz/fees.json" -o site/fees.json || curl -fsSL "https://zoopee-eth.github.io/watcher/paid/fees.json" -o site/fees.json || echo '{}' > site/fees.json
          curl -fsSL "https://paidonpangea.xyz/data.json" -o site/data.json || true
      - name: Build fee leaderboard data
        continue-on-error: true
        run: node scripts/build.js site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Start the next run in ~10 minutes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - ${T0:-0} ))
          wait=$(( 540 - elapsed )); if [ $wait -gt 0 ]; then sleep $wait; fi
          # only one chain: skip if another run is already waiting or running
          active=$(gh run list -R "$GITHUB_REPOSITORY" -w pages.yml -L 20 --json status -q '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          if [ "$active" -le 1 ]; then gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main; else echo "another run is already queued ($active active)"; fi
